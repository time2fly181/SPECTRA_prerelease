[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-sleep-staging"
version = "0.1.0"
description = "SPECTRA: EDF sleep staging with a multirate asymmetric CNN and context transformer"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch==2.9.1",
    "numpy==2.3.3",
    "scipy==1.16.2",
    "pyedflib==0.1.42",
    "mne==1.11.0",
    "PySide6==6.10.0",
    "pyqtgraph==0.14.0",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
]

[project.scripts]
spectra = "spectra.cli:main"
spectra-gui = "spectra.gui:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "black>=26.5.1", "pyright>=1.1.410"]

# PyPI only publishes CPU-only torch wheels for Windows, so Windows installs
# pull the CUDA 12.8 build from the PyTorch index. Linux PyPI wheels already
# bundle CUDA, and macOS uses MPS, so both keep the default PyPI source.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
  \.git
| \.venv
| venv
| build
| dist
| __pycache__
| wandb
| mlruns
| outputs
| runs
| checkpoints
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
